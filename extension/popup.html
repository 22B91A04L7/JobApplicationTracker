<!DOCTYPE html>
<html>

<head>
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h2>Job Tracker</h2>

    <p id="status">Getting job details...</p>

    <div id="pending-job" hidden>

        <div class="pending-header">
            <div>
                <h3>Application Pending</h3>
                <p class="pending-subtitle">
                    Waiting for your confirmation
                </p>
            </div>

            <span class="status-badge">Pending</span>
        </div>

        <p><strong>Title:</strong> <span id="pending-title"></span></p>
        <p><strong>Company:</strong> <span id="pending-company"></span></p>
        <p><strong>Location:</strong> <span id="pending-location"></span></p>
        <p><strong>Salary:</strong> <span id="pending-salary"></span></p>

        <p><strong>Have you applied for this job?</strong></p>
        <p>Confirm only after submitting your application.</p>

        <button id="applied-button">
            Yes, I Applied
        </button>

        <button id="discard-button">
            Discard
        </button>

    </div>

    <div id="success-message" hidden>
        <h3>Application Saved ✓</h3>

        <p id="success-title"></p>
        <p id="success-company"></p>
        <p>Your application was saved successfully.</p>

        <button id="capture-again-button">
            Capture Another Job
        </button>
    </div>

    <div id="job-form" hidden>

        <label>
            Job Title
            <input type="text" id="title">
        </label>

        <label>
            Company
            <input type="text" id="company">
        </label>

        <label>
            Job ID
            <input type="text" id="jobId">
        </label>

        <label>
            Location
            <input type="text" id="location">
        </label>

        <label>
            Salary
            <input type="text" id="salary">
        </label>

        <label>
            Description
            <textarea id="description"></textarea>
        </label>

        <button id="confirm-job">
            Confirm Job
        </button>

    </div>

    <script src="popup.js"></script>

</body>

</html>
